<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kawaii Aqua Pets Admin</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="admin">
<main class="wrap">
  <section id="login" class="panel login">
    <img id="adminLoginLogo" src="assets/logo.png" alt="Kawaii Aqua Pets logo">
    <h1>Kawaii Aqua Pets Admin</h1>
    <form id="loginForm">
      <input id="pass" type="password" placeholder="Admin passcode" required>
      <button class="btn">Open Dashboard</button>
      <p id="loginMsg"></p>
    </form>
  </section>

  <section id="dash" class="hide">
    <div class="top">
      <div class="adminBrand">
        <img id="adminTopLogo" src="assets/logo.png" alt="Store logo">
        <div><h1 id="adminStoreName">Kawaii Aqua Pets</h1><small>Admin Dashboard</small></div>
      </div>
      <a href="index.html" target="_blank" class="btn secondary">View Store</a>
    </div>

    <nav class="tabs">
      <button data-tab="settings">Settings</button>
      <button data-tab="categories">Categories</button>
      <button data-tab="products">Products</button>
      <button data-tab="orders">Orders</button>
      <button data-tab="reviews">Reviews</button>
    </nav>

    <section id="settings" class="panel tabPanel">
      <h2>Website Settings</h2>
      <form id="settingsForm">
        <div class="imagePreviewWrap"><img id="logoPreview" src="assets/logo.png" alt="Logo preview"></div>
        <input name="siteName" placeholder="Website name">
        <input name="tagline" placeholder="Tagline">
        <input name="gcashName" placeholder="GCash account name">
        <input name="gcashNumber" placeholder="GCash number">
        <textarea name="paymentNote" placeholder="Payment note"></textarea>
        <label>New logo <span class="optional">(leave blank to keep current)</span>
          <input name="logoFile" type="file" accept="image/*">
        </label>
        <button class="btn">Save Settings</button>
        <p id="settingsMsg"></p>
      </form>
    </section>

    <section id="categories" class="panel tabPanel hide">
      <h2>Categories</h2>
      <form id="catForm">
        <input type="hidden" name="id">
        <input name="name" placeholder="Category name" required>
        <button class="btn">Save Category</button>
      </form>
      <div id="catList"></div>
    </section>

    <section id="products" class="panel tabPanel hide">
      <h2>Products</h2>
      <form id="prodForm">
        <input type="hidden" name="id">
        <div class="imagePreviewWrap productPreview"><img id="productPreview" src="assets/logo.png" alt="Product image preview"></div>
        <input name="name" placeholder="Product name" required>
        <select name="categoryId" required></select>
        <input name="price" type="number" min="0" step="0.01" placeholder="Price" required>
        <input name="stock" type="number" min="0" step="1" placeholder="Stock" value="1" required>
        <textarea name="description" placeholder="Description"></textarea>
        <label>Product image <span class="optional">(leave blank when editing to keep current)</span>
          <input name="imageFile" type="file" accept="image/*">
        </label>
        <label class="checkLabel"><input name="active" type="checkbox" checked> Show on store</label>
        <div class="actions">
          <button class="btn" type="submit">Save Product</button>
          <button class="btn secondary" type="button" id="cancelProductEdit">Clear Form</button>
        </div>
        <p id="prodMsg"></p>
      </form>
      <div id="prodList" class="grid"></div>
    </section>

    <section id="orders" class="panel tabPanel hide">
      <h2>Orders</h2>
      <div class="tableWrap">
        <table>
          <thead><tr><th>Date</th><th>Customer</th><th>Order</th><th>Total</th><th>Proof</th><th>Status</th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </section>

    <section id="reviews" class="panel tabPanel hide">
      <div class="reviewAdminHead">
        <div>
          <h2>Customer Reviews</h2>
          <p>Customer review photos use the same permanent Google Drive image system.</p>
        </div>
      </div>
      <div id="adminReviewsGrid" class="adminReviewsGrid"></div>
    </section>
  </section>
</main>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
